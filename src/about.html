    <title>Mentegraf</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; background:#f7f8fa; color:#333; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
        .hero { width:100%; background:linear-gradient(135deg,#2c3e50 0%,#3d5a80 100%); color:#fff; padding:28px 24px 22px; text-align:center; flex-shrink:0; }
        .app-icon { width:64px; height:64px; background:rgba(255,255,255,.15); border-radius:16px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:10px; }
        .app-icon img { height:48px; }
        .hero h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:.3px; }
        .version { display:inline-block; margin-top:6px; background:rgba(255,255,255,.2); border-radius:12px; padding:2px 12px; font-size:12px; letter-spacing:.5px; }
        .content { flex:1; overflow-y:auto; padding:20px 28px 28px; }
        .content::-webkit-scrollbar { width:5px; }
        .content::-webkit-scrollbar-thumb { background:#ccc; border-radius:3px; }
        .desc { font-size:13px; line-height:1.7; color:#555; margin-bottom:20px; }
        .section-title { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:#999; margin-bottom:10px; margin-top:4px; }
        .feature-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:22px; }
        .feature-item { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:12px 14px; font-size:12px; display:flex; align-items:flex-start; gap:10px; transition:border-color .15s; }
        .feature-item:hover { border-color:#3d5a80; }
        .feature-item .icon { font-size:20px; flex-shrink:0; width:28px; text-align:center; margin-top:1px; }
        .feature-item strong { display:block; font-size:12px; font-weight:600; margin-bottom:3px; color:#2c3e50; }
        .feature-item span { color:#666; font-size:11px; line-height:1.5; }
        .shortcut-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:22px; }
        .shortcut-item { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:8px 12px; font-size:12px; display:flex; align-items:center; gap:8px; }
        .shortcut-item kbd { background:#f0f0f0; border:1px solid #d0d0d0; border-radius:4px; padding:1px 6px; font-size:11px; font-family:'SF Mono',Consolas,monospace; color:#444; white-space:nowrap; }
        .shortcut-item .arrow { color:#999; font-size:10px; }
        .shortcut-item .label { color:#555; font-size:11px; }
        .shortcut-item .arrow { color:#999; font-size:10px; }
        .shortcut-item .label { color:#555; font-size:11px; }
        .tech-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
        .tech-badge { background:#e8f0fe; color:#1a56db; border-radius:6px; padding:3px 10px; font-size:11px; font-weight:600; }
        .meta-row { font-size:12px; color:#888; display:flex; justify-content:space-between; align-items:center; border-top:1px solid #e5e7eb; padding-top:14px; margin-top:8px; }
        .footer-logo { text-align:center; padding:16px 0 8px; }
        .footer-logo img { max-height:40px; opacity:.7; }
        .footer-link { text-align:center; font-size:11px; color:#999; padding-bottom:8px; }
    </style>

<script>
    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'en';

    function loadLocale(l, cb) {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'lang/' + l + '.json');
        xhr.onload = function() { cb(JSON.parse(xhr.responseText)); };
        xhr.onerror = function() { if (l !== 'en') loadLocale('en', cb); };
        xhr.send();
    }

    function t(key) {
        var parts = key.split('.');
        var v = window._s || {};
        for (var i = 0; i < parts.length; i++) {
            if (v == null) break;
            v = v[parts[i]];
        }
        return typeof v === 'string' ? v : '';
    }

    function apply() {
        // Text content
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
            var v = t(el.dataset.i18n);
            if (v) el.textContent = v;
        });

        // Title
        var title = t('about.title');
        if (title) document.title = title;

        // Build shortcuts grid from data
        var grid = document.getElementById('shortcutGrid');
        grid.innerHTML = '';
        var shortcuts = [
            { keys: 'Ctrl+D', label: 'about.shortcutList.addNode' },
            { keys: 'Alt+Click', label: 'about.shortcutList.altClick' },
            { keys: 'Ctrl+Click', label: 'about.shortcutList.ctrlClick' },
            { keys: 'Delete', label: 'about.shortcutList.delete' },
            { keys: 'Ctrl+Z', label: 'about.shortcutList.undo' },
            { keys: 'Ctrl+Shift+Z', label: 'about.shortcutList.redo' },
            { keys: 'Ctrl+S', label: 'about.shortcutList.save' },
            { keys: 'Esc', label: 'about.shortcutList.escape' },
        ];

        shortcuts.forEach(function(sc) {
            var val = t(sc.label);
            // Extract just the description part after →
            var desc = val.indexOf('→') >= 0 ? val.split('→')[1].trim() : val;
            var div = document.createElement('div');
            div.className = 'shortcut-item';
            div.innerHTML = '<kbd>' + sc.keys + '</kbd><span class="arrow">→</span><span class="label">' + desc + '</span>';
            grid.appendChild(div);
        });
    }

    loadLocale(lang, function(s) { window._s = s; apply(); });
</script>
